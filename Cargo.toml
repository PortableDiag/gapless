[package]
name = "gapless"
version = "0.1.4"
edition = "2021"

[dependencies]
# These four must stay on the same glib generation (0.20) or you get two
# incompatible glib::Object types and nothing compiles.
# Feature flags gate the bindings to a minimum C library version. Ubuntu 24.04
# ships GTK 4.14 and libadwaita 1.5; without these, FileDialog and ToolbarView
# aren't compiled in.
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gst = { package = "gstreamer", version = "0.23" }
gst-app = { package = "gstreamer-app", version = "0.23" }
gst-controller = { package = "gstreamer-controller", version = "0.23" }
glib = "0.20"

async-channel = "2"
anyhow = "1"
walkdir = "2"
lofty = "0.21"
mpris-server = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
